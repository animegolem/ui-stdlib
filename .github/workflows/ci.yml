name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux frozen gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.19.0
          run_install: false

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.10.0
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Schema and admission
        run: pnpm run schema

      - name: ESLint authority
        run: pnpm run lint

      - name: Oxlint parity
        run: pnpm run lint:parity

      - name: Unit tests
        run: pnpm run test

      - name: RAG contracts
        run: pnpm run rag:validate

# This workflow makes a Linux claim only. Electron, GPU, performance, and
# cross-OS artifact-digest claims remain outside this infrastructure wave.
